[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "zooniverse-platform-dashboard"
version = "0.1.0"
description = "Internal platform-wide aggregate analytics for Zooniverse"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "dash>=3.1,<4",
  "plotly>=6.0,<7",
  "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.1,<4",
  "requests>=2.32,<3",
  "python-dotenv>=1.0,<2",
]
[project.optional-dependencies]
server = ["gunicorn>=23,<26"]
analysis = ["numpy>=1.26,<3", "scipy>=1.12,<2", "statsmodels>=0.14,<1"]
dev = ["pytest>=8,<10", "black>=25,<27", "ruff>=0.10,<1"]
docs = ["sphinx>=8,<10", "myst-parser>=4,<5", "furo>=2025.7", "sphinx-autoapi>=3.6,<4"]
[project.scripts]
rebuild-anomalies = "zooniverse_dashboard.anomalies.__main__:main"
refresh-data = "zooniverse_dashboard.cli:refresh_data"
set-date-limit = "zooniverse_dashboard.cli:set_date_limit"

[tool.hatch.build.targets.wheel]
packages = ["src/zooniverse_dashboard"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".","src"]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.black]
line-length = 100
target-version = ["py311"]
