name: Tests and quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

# No database, ERAS or deployment credentials are required.
permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install application and check dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,docs,server,analysis]'

      - name: Black formatting
        run: black --check app.py src tests

      - name: Ruff linting
        run: ruff check app.py src tests

      - name: Offline unit and application tests
        run: pytest -q

  docker-smoke:
    name: Build and smoke-test Docker runtime
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build image
        run: docker build --platform linux/amd64 --tag zooniverse-platform-dashboard:smoke .
      - name: Start container and verify runtime
        run: bash scripts/docker_smoke.sh zooniverse-platform-dashboard:smoke
